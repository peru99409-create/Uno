<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ウェブチャット</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: 72px rail | 288px sidebar | main | 320px panel. Mobile: single column + drawer + tab bar. All spacing in 8px steps. */
:root{
  --bg0:#111413;--bg1:#171a19;--bg2:#1d2120;--bg3:#262b2a;--bg4:#2f3534;
  --line:#2f3534;--text:#e8edeb;--text2:#9ba7a3;--text3:#69756f;
  --accent:#4cc09a;--on-accent:#0c1f18;--danger:#e0716a;
  --shadow:0 8px 24px rgb(0 0 0/.28);
  --scrim:rgb(0 0 0/.5);
  color-scheme:dark;
  --font:'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --d1:120ms;--d2:200ms;--d3:320ms;--d4:480ms;
  --r1:8px;--r2:16px;
  --rail:72px;--side:288px;--panel:320px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg0:#e6e9e6;--bg1:#eef1ee;--bg2:#f7f9f6;--bg3:#ffffff;--bg4:#e3e7e3;
  --line:#d7dcd7;--text:#19201d;--text2:#56625d;--text3:#8a948f;
  --accent:#1c9a74;--on-accent:#ffffff;--danger:#c9453d;
  --shadow:0 8px 24px rgb(20 30 25/.14);--scrim:rgb(20 30 25/.35);color-scheme:light}}
:root[data-theme="light"]{
  --bg0:#e6e9e6;--bg1:#eef1ee;--bg2:#f7f9f6;--bg3:#ffffff;--bg4:#e3e7e3;
  --line:#d7dcd7;--text:#19201d;--text2:#56625d;--text3:#8a948f;
  --accent:#1c9a74;--on-accent:#ffffff;--danger:#c9453d;
  --shadow:0 8px 24px rgb(20 30 25/.14);--scrim:rgb(20 30 25/.35);color-scheme:light}
:root[data-density="compact"]{--row:40px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg0);color:var(--text);font:400 14px/24px var(--font);-webkit-font-smoothing:antialiased;padding-left:0;padding-right:0}
:root{--row:56px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{background:var(--bg1);border:1px solid var(--line);border-radius:var(--r1);outline:0;width:100%}
::placeholder{color:var(--text3)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:8px}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}
.hide{display:none!important}
.row{display:flex;align-items:center;gap:8px}.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}.mute{color:var(--text2)}.faint{color:var(--text3)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xs{font-size:12px;line-height:16px}.h1{font-size:32px;line-height:40px;font-weight:700}.h2{font-size:24px;line-height:32px;font-weight:700}.h3{font-size:16px;line-height:24px;font-weight:700}
.mono{font-family:var(--mono)}
/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r1);background:var(--bg3);border:1px solid var(--line);font-weight:500;transition:background var(--d1),transform var(--d1) var(--ease),border-color var(--d1);user-select:none}
.btn:hover{background:var(--bg4)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--bg3)}
.btn.danger{color:var(--danger)}
.btn.sm{height:32px;padding:0 12px}.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.ib{position:relative;overflow:hidden;width:40px;height:40px;border-radius:var(--r1);display:inline-grid;place-items:center;color:var(--text2);transition:background var(--d1),color var(--d1),transform var(--d1) var(--ease);flex:none}
.ib:hover{background:var(--bg3);color:var(--text)}.ib:active{transform:scale(.9)}.ib.on{color:var(--accent)}
.ib.sm{width:32px;height:32px}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rip .5s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
/* inputs */
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field label{font-size:12px;line-height:16px;color:var(--text2);font-weight:500}
.inp{height:40px;padding:0 12px;transition:border-color var(--d1),box-shadow var(--d2)}
.inp:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.field .err{color:var(--danger);font-size:12px;line-height:16px;min-height:16px}
.inp.bad{border-color:var(--danger)}
.shake{animation:shake .4s var(--ease)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.search{position:relative}.search .ic{position:absolute;left:12px;top:10px;color:var(--text3)}.search .inp{padding-left:40px}
/* avatar */
.av{--s:40px;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:calc(var(--s)*.4);color:var(--text);background:var(--bg4);background-size:cover;background-position:center;user-select:none}
.av.t0{background-color:color-mix(in srgb,var(--accent) 12%,var(--bg4))}.av.t1{background-color:color-mix(in srgb,var(--accent) 24%,var(--bg4))}.av.t2{background-color:color-mix(in srgb,var(--accent) 36%,var(--bg4))}.av.t3{background-color:color-mix(in srgb,var(--text) 14%,var(--bg4))}.av.t4{background-color:color-mix(in srgb,var(--text) 24%,var(--bg4))}
.av.s24{--s:24px}.av.s32{--s:32px}.av.s48{--s:48px}.av.s64{--s:64px}.av.s96{--s:96px}
.av.sq{border-radius:16px}.av.rail{--s:48px;border-radius:24px;transition:border-radius var(--d2) var(--ease),background var(--d2)}
.dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg1);background:var(--text3)}
.dot.online{background:var(--accent)}
.dot.online::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1px solid var(--accent);animation:pulse 2.4s var(--ease) infinite}
.dot.away{background:linear-gradient(90deg,var(--accent) 50%,var(--bg1) 50%);box-shadow:inset 0 0 0 1px var(--accent)}
.dot.offline{background:var(--bg1);box-shadow:inset 0 0 0 2px var(--text3)}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.badge{min-width:20px;height:20px;padding:0 8px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;line-height:20px;font-weight:700;text-align:center;flex:none}
.badge.pop{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.tag{display:inline-block;height:16px;padding:0 8px;border-radius:8px;font-size:12px;line-height:16px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:500}
/* shell */
#shell{position:fixed;inset:0;display:grid;grid-template-columns:var(--rail) var(--side) 1fr;background:var(--bg0)}
#shell.hasPanel{grid-template-columns:var(--rail) var(--side) 1fr var(--panel)}
#rail{background:var(--bg0);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px;overflow-y:auto}
#rail .sp{flex:1}
.rbtn{position:relative;width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:24px;background:var(--bg3);color:var(--text2);transition:border-radius var(--d2) var(--ease),background var(--d2),color var(--d2),transform var(--d1)}
.rbtn:hover{border-radius:16px;color:var(--text);background:var(--bg4)}.rbtn:active{transform:scale(.92)}
.rbtn.on{border-radius:16px;background:var(--accent);color:var(--on-accent)}
.rbtn .pip{position:absolute;left:-12px;top:16px;width:4px;height:0;border-radius:0 4px 4px 0;background:var(--text);transition:height var(--d2) var(--ease)}
.rbtn.on .pip{height:16px}.rbtn.unread .pip{height:8px}
.rbtn .badge{position:absolute;right:-4px;bottom:-4px;border:2px solid var(--bg0);height:20px}
.rsep{width:32px;height:1px;background:var(--line);flex:none}
#side{background:var(--bg1);display:flex;flex-direction:column;min-width:0;border-radius:16px 0 0 0;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.side-h{height:56px;padding:0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);flex:none}
.side-b{flex:1;overflow-y:auto;padding:8px}
.nav{display:flex;align-items:center;gap:16px;height:40px;padding:0 8px 0 16px;border-radius:var(--r1);color:var(--text2);width:100%;text-align:left;transition:background var(--d1),color var(--d1),transform var(--d1)}
.nav:hover{background:var(--bg3);color:var(--text)}.nav:active{transform:scale(.98)}
.nav.on{background:var(--bg4);color:var(--text)}
.nav .badge{margin-left:auto}
.sec{padding:16px 16px 8px;font-size:12px;line-height:16px;color:var(--text3);font-weight:700;display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.sec .ic{transition:transform var(--d2) var(--ease)}.sec.shut .ic{transform:rotate(-90deg)}
.acc{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--d3) var(--ease)}.acc>div{overflow:hidden}
.acc.shut{grid-template-rows:0fr}
#main{position:relative;background:var(--bg2);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-top:1px solid var(--line)}
#panel{background:var(--bg1);border-left:1px solid var(--line);border-top:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.top{height:56px;flex:none;padding:0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--bg2);position:relative;z-index:2}
.top .t{font-weight:700;font-size:16px}
.page{flex:1;min-height:0;overflow-y:auto;padding:24px;overscroll-behavior:contain}
.page>.in{max-width:880px;margin:0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg2)}
.screen.enter{animation:slideIn var(--d3) var(--ease) both}
.screen.back{animation:slideBack var(--d3) var(--ease) both}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
/* list rows */
.item{position:relative;display:flex;align-items:center;gap:16px;min-height:var(--row);padding:8px 16px;border-radius:var(--r1);width:100%;text-align:left;transition:background var(--d1),transform var(--d1);background:transparent}
.item:hover{background:var(--bg3)}.item.on{background:var(--bg4)}
.swipe{position:relative;overflow:hidden;border-radius:var(--r1)}
.swipe .acts{position:absolute;right:0;top:0;bottom:0;display:flex;opacity:0;transition:opacity var(--d1)}.swipe.open .acts{opacity:1}
.swipe .acts button{width:72px;display:grid;place-items:center;background:var(--bg4);color:var(--text)}
.swipe .acts button.d{background:var(--danger);color:#fff}
.swipe .item{background:var(--bg1);touch-action:pan-y;transition:transform var(--d2) var(--ease),background var(--d1)}
.swipe .item.drag{transition:none}
.card{background:var(--bg1);border:1px solid var(--line);border-radius:var(--r2);padding:24px}
.grid{display:grid;gap:16px}
.reveal{opacity:0;transform:translateY(16px);transition:opacity var(--d4) var(--ease),transform var(--d4) var(--ease)}.reveal.in{opacity:1;transform:none}
/* segmented / tabs */
.seg{display:inline-flex;padding:4px;background:var(--bg1);border:1px solid var(--line);border-radius:12px;position:relative;gap:0}
.seg button{position:relative;z-index:1;height:32px;padding:0 16px;border-radius:8px;color:var(--text2);font-weight:500;transition:color var(--d2)}
.seg button.on{color:var(--text)}
.seg .pill{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:8px;background:var(--bg4);transition:left var(--d3) var(--ease),width var(--d3) var(--ease)}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);padding:0 16px}
.tabs button{height:48px;color:var(--text2);position:relative;font-weight:500}
.tabs button.on{color:var(--text)}.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);animation:grow var(--d3) var(--ease)}
@keyframes grow{from{transform:scaleX(0)}}
/* switch */
.sw{width:48px;height:24px;border-radius:12px;background:var(--bg4);position:relative;flex:none;transition:background var(--d2)}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--text);transition:transform var(--d2) var(--spring)}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(24px);background:var(--on-accent)}
.setrow{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.setrow:last-child{border:0}
/* select */
.sel{position:relative}.sel>button{width:100%;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border:1px solid var(--line);border-radius:var(--r1);background:var(--bg1)}
/* progress */
.prog{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);border-radius:4px;width:0;transition:width var(--d4) var(--ease)}
/* skeleton */
.sk{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.spin{width:24px;height:24px;border-radius:50%;border:2px solid var(--bg4);border-top-color:var(--accent);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* kinetic type */
.kin .ch{display:inline-block;overflow:hidden;vertical-align:top}.kin .ch>i{display:inline-block;font-style:normal;transform:translateY(110%);animation:kin .7s var(--ease) forwards;animation-delay:calc(var(--i)*40ms + var(--base,0ms))}
@keyframes kin{to{transform:none}}
/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:48px 24px;color:var(--text2)}
.empty .ring{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--text3);margin-bottom:8px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
/* floating layers */
#layers{position:fixed;inset:0;pointer-events:none;z-index:50}
#layers>*{pointer-events:auto}
.scrim{position:fixed;inset:0;background:var(--scrim);animation:fade var(--d2) both;z-index:50}
@keyframes fade{from{opacity:0}}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100vw - 32px));max-height:calc(100% - 64px);overflow:auto;background:var(--bg1);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow);padding:24px;z-index:51;animation:modal var(--d3) var(--spring) both}
@keyframes modal{from{opacity:0;transform:translate(-50%,-48%) scale(.94)}}
.modal.out,.scrim.out{animation:fadeout var(--d2) forwards}@keyframes fadeout{to{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:var(--bg1);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:51;animation:sheet var(--d3) var(--ease) both}
@keyframes sheet{from{transform:translateY(100%)}}
.sheet.out{animation:sheetout var(--d2) var(--ease) forwards}@keyframes sheetout{to{transform:translateY(100%)}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--bg4);margin:0 auto 16px}
.pop{}
.menu{position:fixed;min-width:208px;padding:8px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;animation:menu var(--d2) var(--ease) both;transform-origin:var(--ox,top left)}
@keyframes menu{from{opacity:0;transform:scale(.95) translateY(-4px)}}
.menu button{display:flex;align-items:center;gap:16px;height:40px;padding:0 16px;width:100%;border-radius:var(--r1);text-align:left;transition:background var(--d1)}
.menu button:hover{background:var(--bg4)}.menu button.danger{color:var(--danger)}.menu hr{border:0;height:1px;background:var(--line);margin:8px 0}
.menu .emo{display:grid;grid-template-columns:repeat(6,40px);gap:0}.menu .emo button{width:40px;padding:0;justify-content:center;font-size:20px}
.tip{position:fixed;z-index:70;padding:4px 8px;background:var(--text);color:var(--bg0);border-radius:8px;font-size:12px;line-height:16px;pointer-events:none;animation:fade var(--d1) both;white-space:nowrap}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:80;pointer-events:none;width:min(420px,calc(100vw - 32px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:16px;width:100%;padding:12px 16px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);animation:toast var(--d3) var(--spring) both}
.toast.out{animation:toastout var(--d2) var(--ease) forwards}
.toast .ic{color:var(--accent)}.toast.err .ic{color:var(--danger)}
@keyframes toast{from{opacity:0;transform:translateY(24px) scale(.96)}}@keyframes toastout{to{opacity:0;transform:translateY(8px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
/* morph FAB */
.fab{position:absolute;right:24px;bottom:24px;width:56px;height:56px;border-radius:28px;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);overflow:hidden;z-index:20;transition:width var(--d4) var(--ease),height var(--d4) var(--ease),border-radius var(--d4) var(--ease),background var(--d3),color var(--d3)}
.fab>.f{position:absolute;inset:0;display:grid;place-items:center;transition:opacity var(--d2),transform var(--d3) var(--ease)}
.fab>.p{position:absolute;inset:0;opacity:0;pointer-events:none;padding:16px;overflow:auto;transition:opacity var(--d2);text-align:left}
.fab.open{width:min(360px,calc(100vw - 48px));height:min(480px,calc(100% - 48px));border-radius:16px;background:var(--bg3);color:var(--text);border:1px solid var(--line)}
.fab.open>.f{opacity:0;transform:rotate(90deg) scale(.5);pointer-events:none}.fab.open>.p{opacity:1;pointer-events:auto;transition-delay:.18s}
/* auth */
#auth{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg0);overflow:hidden;padding:16px}
#auth .bgl{position:absolute;inset:-10%;pointer-events:none}
#auth .bgl i{position:absolute;border:1px solid var(--line);border-radius:50%;transition:transform .3s var(--ease)}
.authbox{position:relative;width:min(400px,100%);animation:rise var(--d4) var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.authbox .card{padding:32px}
.logo{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--accent);color:var(--on-accent)}
/* chat */
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;position:relative;overscroll-behavior:contain}
.msgs>.sp{flex:1}
.day{align-self:center;margin:16px 0 8px;padding:0 16px;height:24px;border-radius:12px;background:var(--bg3);font-size:12px;line-height:24px;color:var(--text2)}
.m{position:relative;display:flex;gap:8px;max-width:100%;padding:2px 0;transition:background var(--d1)}
.m.enter{animation:msgin var(--d3) var(--ease) both}
@keyframes msgin{from{opacity:0;transform:translateY(16px) scale(.98)}}
.m.me{flex-direction:row-reverse}
.m .body{display:flex;flex-direction:column;max-width:min(560px,78%);min-width:0}

/* ===== rooms: official / user-created (max 3 joined) ===== */
const ROOM_MAX=3,NAME_MAX=24,DESC_MAX=120;
const RM={q:''};
const nk=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const pubRooms=()=>Object.values(db.rooms).filter(r=>r.pub);
const myPub=(id=me.id)=>pubRooms().filter(r=>r.members.includes(id));
const isIn=r=>r.members.includes(me.id);
const canEditRoom=r=>r.official?me.role==='admin':(r.owner===me.id||me.role==='admin');
const lastTs=r=>{const l=lastMsg(r.id);return l?l.ts:r.created};
const hlText=(s,q)=>{const e=esc(s);if(!q)return e;return e.replace(new RegExp(escRe(esc(q)),'ig'),m=>`<span class="mention">${m}</span>`)};
const obBadge=(sm)=>`<span class="ob ${sm?'sm':''}">${sm?'':ic('shield')}OFFICIAL</span>`;

/* ---- seed (once) ---- */
function ensureOfficial(d){
 if(d.officialInit)return false;d.officialInit=true;
 const t=now(),day=864e5;
 const mk=(id,name,desc,official,age,lines)=>{d.rooms[id]={id,type:'group',pub:true,official,name,desc,owner:official?null:BOT,members:official?[]:[BOT],pins:[],muted:{},popOff:{},created:t-age};
  d.msgs[id]=lines.map((txt,i)=>({id:uid('m'),room:id,from:BOT,text:txt,ts:t-age+(i+1)*6e4*7,readBy:[BOT],reactions:{}}))};
 mk('or_lobby','ロビー','はじめての人も気軽に参加できる総合ルームです。あいさつや雑談はここで。',true,30*day,['ロビーへようこそ。ここは誰でも参加できる公式ルームです。','困ったことがあれば「使い方・サポート」ルームも見てみてください。']);

 mk('ur_photo','写真散歩部','撮った写真と、見つけた散歩コースを見せ合うルームです。',false,5*day,['先週の夕焼けがきれいでした。みなさんのお気に入りの時間帯はありますか？']);
 mk('ur_night','深夜の作業通話','夜更かしして作業する人のための雑談ルーム。',false,3*day,['今夜は静かですね。おやすみ前の一杯どうぞ。']);

 return true}

/* ---- validation ---- */
function nameError(v,exId,exOfficial){v=String(v||'').trim();
 if(!v)return 'ルーム名を入力してください';
 if([...v].length>NAME_MAX)return `${NAME_MAX}文字以内にしてください`;
 if(!exOfficial&&/official|公式|運営/.test(nk(v)))return '「公式」「OFFICIAL」「運営」を含む名前は使えません';
 if(pubRooms().some(r=>r.id!==exId&&nk(r.name)===nk(v)))return '同じ名前のルームがすでにあります。別の名前にしてください';
 return ''}

/* ---- cards ---- */
function roomCard(r,q='',prev=false){
 const joined=!prev&&isIn(r),owner=r.official?'運営':(U(r.owner)?.name||'不明');
 const act=prev?`<button class="btn pri grow" disabled>参加する</button>`:joined?`<button class="btn grow" data-act="room" data-id="${r.id}">開く</button><span class="row xs" style="color:var(--accent);gap:4px">${ic('check','sm')}参加中</span>`:`<button class="btn pri grow" data-act="joinRoom" data-id="${r.id}">参加する</button>`;
 return `<div class="rcard ${r.official?'off':''} ${prev?'':'reveal'}"><div class="row" style="gap:16px;align-items:flex-start"><span class="rav">${ic(r.official?'shield':'users','lg')}</span><div class="grow col" style="min-width:0"><b class="ell">${hlText(r.name,q)}</b><span class="xs mute row" style="gap:8px;min-width:0">${ic('users','sm')}<span>${r.members.length}人</span><span class="faint">・</span><span class="ell">${r.official?'運営':'作成者 '+esc(owner)}</span></span></div>${r.official?obBadge():''}</div>
 <p class="rdesc">${hlText(r.desc||'説明はありません',q)}</p><div class="row" style="gap:16px">${act}</div></div>`}
function mineRow(r){const n=unreadOf(r),mu=r.muted[me.id];
 return `<div class="item reveal" role="button" tabindex="0" data-act="room" data-id="${r.id}" style="min-height:64px">${roomAv(r,'s40')}<span class="grow col" style="min-width:0"><span class="row" style="gap:8px"><b class="ell">${esc(r.name)}</b>${r.official?obBadge(1):''}</span><span class="xs mute">${r.members.length}人${mu?' ・ ミュート中':''}${r.popOff&&r.popOff[me.id]?' ・ ポップアップ オフ':''}</span></span>${n&&!mu?`<span class="badge">${n}</span>`:''}<button class="ib sm" data-act="roomMenu" data-menu data-id="${r.id}" aria-label="ルームの設定">${ic('more')}</button></div>`}
function roomsBody(){
 const q=RM.q.trim(),all=pubRooms();
 if(q){const k=nk(q);const res=all.filter(r=>nk(r.name).includes(k)||nk(r.desc||'').includes(k)).sort((a,b)=>(b.official-a.official)||b.members.length-a.members.length);
  return sub(`検索結果 ${res.length}件`)+(res.length?`<div class="rgrid">${res.map(r=>roomCard(r,q)).join('')}</div>`:empty('search',`「${q}」のルームはありません`,'別の言葉で探すか、この名前で新しく作れます。',`<button class="btn pri" data-act="roomNew" data-name="${esc(q)}">${ic('plus','sm')}この名前で作成</button>`))}
 const off=all.filter(r=>r.official).sort((a,b)=>a.created-b.created),usr=all.filter(r=>!r.official);
 const pop=[...usr].sort((a,b)=>b.members.length-a.members.length||lastTs(b)-lastTs(a)).slice(0,6);
 const nw=[...usr].sort((a,b)=>b.created-a.created).slice(0,6),mine=myPub();
 const none=empty('users','まだルームがありません','最初のルームを作ってみましょう。',`<button class="btn pri" data-act="roomNew">${ic('plus','sm')}ルームを作成</button>`);
 return (mine.length?sub('参加中のルーム')+`<div class="col">${mine.map(mineRow).join('')}</div>`:'')
  +sub(`公式ルーム <span class="faint xs" style="margin-left:8px">運営が用意したルーム</span>`)+(off.length?`<div class="rgrid">${off.map(r=>roomCard(r)).join('')}</div>`:'<p class="mute">公式ルームはありません。</p>')
  +sub('人気のルーム')+(pop.length?`<div class="rgrid">${pop.map(r=>roomCard(r)).join('')}</div>`:none)
  +sub('新着ルーム')+(nw.length?`<div class="rgrid">${nw.map(r=>roomCard(r)).join('')}</div>`:none)}
function commSwitch(cur){return `<div style="margin-bottom:24px">${segHTML('commSeg',[['rooms','ルーム'],['servers','サーバー']],cur)}</div>`}
function slotsCard(){const n=myPub().length;

function fillPips(){const n=myPub().length;requestAnimationFrame(()=>requestAnimationFrame(()=>$$('.pips i').forEach((e,i)=>e.classList.toggle('on',i<n))))}

R.rooms=el=>{
 el._after=()=>{segInit($('#commSeg'),v=>{if(v!=='rooms')go(v)});fillPips();

/* ---- join / leave ---- */
function purgeRoom(d,id){Object.values(d.files).filter(f=>f.room===id).forEach(f=>{Blobs.del(f.id);delete d.files[f.id]});delete d.rooms[id];delete d.msgs[id]}
function leaveCore(id){let deleted=false;
 tx(d=>{const r=d.rooms[id];if(!r||!r.pub)return;r.members=r.members.filter(x=>x!==me.id);delete r.muted[me.id];if(r.popOff)delete r.popOff[me.id];
  if(!r.official&&r.owner===me.id){const next=r.members.find(x=>x!==BOT&&d.users[x]);if(next){r.owner=next;notify(next,{type:'system',text:`「${r.name}」の管理者になりました`,room:id})}else{purgeRoom(d,id);deleted=true}}});
 return deleted}
function limitDlg(done,verb){
 toast(`同時に参加できるルームは${ROOM_MAX}つまでです`,'err');
 const mine=myPub();
 const m=openModal(`<div class="h3" style="margin-bottom:8px">参加できるルームは${ROOM_MAX}つまでです</div><p class="mute" style="margin-bottom:16px">${verb}するには、参加中のルームを1つ退出してください。</p><div class="col" style="margin-bottom:24px">${mine.map(r=>`<div class="item" style="min-height:56px"><span class="grow col" style="min-width:0"><span class="row" style="gap:8px"><b class="ell">${esc(r.name)}</b>${r.official?obBadge(1):''}</span><span class="xs mute">${r.members.length}人</span></span><button class="btn sm danger" data-leave="${r.id}">退出して続ける</button></div>`).join('')}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-close>キャンセル</button></div>`);
 m.addEventListener('click',e=>{const b=e.target.closest('[data-leave]');if(!b)return;const id=b.dataset.leave;leaveCore(id);m.close();toast('退出しました');if(route.n==='room'&&route.id===id)go('rooms',{},{replace:1});done&&done()})}
A.joinRoom=el=>{const id=el.dataset.id;let res='ok',rname='';
 tx(d=>{const rr=d.rooms[id];if(!rr||!rr.pub){res='gone';return}if(rr.members.includes(me.id)){res='in';return}
  if(Object.values(d.rooms).filter(x=>x.pub&&x.members.includes(me.id)).length>=ROOM_MAX){res='cap';return}
  rr.members.push(me.id);rname=rr.name;if(!rr.official&&rr.owner&&rr.owner!==BOT)notify(rr.owner,{type:'system',text:`${me.name}さんが「${rr.name}」に参加しました`,room:id})});
 if(res==='cap'){limitDlg(()=>A.joinRoom(el),`「${db.rooms[id]?.name||''}」に参加`);return}
 if(res==='gone'){toast('このルームは見つかりません','err');renderMain('none');return}
 if(res==='ok'){burstEl(el,20);toast(`「${rname}」に参加しました`)}
 setTimeout(()=>go('room',{id}),res==='ok'?220:0)};
A.leaveRoom=el=>{const id=el.dataset.id,r=db.rooms[id];if(!r)return;
 const lone=!r.official&&r.owner===me.id&&!r.members.some(x=>x!==me.id&&x!==BOT&&U(x));
 confirmBox('ルームから退出',lone?`あなた以外のメンバーがいないため、退出すると「${r.name}」は削除されます。`:`「${r.name}」から退出します。メッセージ履歴は残っているメンバーに残ります。${!r.official&&r.owner===me.id?' 管理者は次のメンバーに引き継がれます。':''}`,'退出',()=>{leaveCore(id);toast('退出しました');if(route.n==='room'&&route.id===id)go('rooms',{},{replace:1});else renderAll('none')})};

/* ---- per-room notification controls ---- */
function notifMenu(el,id){const r=db.rooms[id];if(!r)return;const mu=!!r.muted[me.id],po=!!(r.popOff&&r.popOff[me.id]);
